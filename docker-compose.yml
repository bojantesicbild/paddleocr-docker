services:
  paddle-ocr:
    build:
      context: .
      dockerfile: Dockerfile
    image: paddle-ocr-viewer:latest
    container_name: paddle-ocr
    ports:
      - "${HOST_PORT:-8090}:8080"
    environment:
      OCR_LANGUAGE: "${OCR_LANGUAGE:-ch}"
      OCR_JOB_TIMEOUT: "${OCR_JOB_TIMEOUT:-1800}"
      OCR_RESULT_TTL: "${OCR_RESULT_TTL:-86400}"
      # When set, API requires X-API-Key header on /ocr/* and /jobs/*.
      OCR_API_KEY: "${OCR_API_KEY:-}"
    restart: unless-stopped
    volumes:
      # Persist downloaded Docling models so rebuilds don't re-download.
      # Path matches DOCLING_ARTIFACTS_PATH + HF_HOME parents in the Dockerfiles.
      - docling-models:/tmp/.docling
      - hf-cache:/tmp/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 10

volumes:
  docling-models:
  hf-cache:
