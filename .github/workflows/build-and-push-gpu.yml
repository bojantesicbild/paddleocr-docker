name: Build and push GPU image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.gpu'
      - 'app/**'
      - 'requirements.txt'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/paddleocr-docker:gpu-latest
            ghcr.io/${{ github.repository_owner }}/paddleocr-docker:gpu-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
