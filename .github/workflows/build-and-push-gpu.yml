name: Build and push GPU image

on:
  push:
    branches: [ main, feat/docling ]
    paths:
      - 'Dockerfile.gpu'
      - 'app/**'
      - 'requirements.txt'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          # main → `gpu-latest`; any other branch → `gpu-<sanitized-branch>-latest`
          # so feature branches don't clobber main's image.
          branch='${{ github.ref_name }}'
          if [ "$branch" = "main" ]; then
            tag_latest="gpu-latest"
          else
            slug=$(echo "$branch" | tr '/_' '-' | tr -cd 'a-zA-Z0-9-')
            tag_latest="gpu-$slug-latest"
          fi
          echo "tag_latest=$tag_latest" >> "$GITHUB_OUTPUT"
          echo "tag_sha=gpu-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Pre-flight summary
        env:
          API_KEY_RAW: ${{ secrets.OCR_API_KEY }}
        run: |
          if [ -n "$API_KEY_RAW" ]; then
            api_key_status="set (length: ${#API_KEY_RAW})"
          else
            api_key_status="not set — image will run without auth"
          fi
          {
            echo "## Build configuration"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repo | \`${{ github.repository }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| OCR_API_KEY secret | $api_key_status |"
            echo "| PRECACHE_MODELS | \`0\` (CI runners have no NVIDIA driver) |"
            echo "| Tags | \`${{ steps.tags.outputs.tag_latest }}\`, \`${{ steps.tags.outputs.tag_sha }}\` |"
            echo "| Target platform | \`linux/amd64\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          platforms: linux/amd64
          build-args: |
            OCR_API_KEY=${{ secrets.OCR_API_KEY }}
            # CI runners have no NVIDIA driver, so importing paddlepaddle-gpu
            # to bake models fails. The first container boot on the GPU host
            # downloads models into the paddle-models volume and they stay
            # cached from then on. Build with PRECACHE_MODELS=1 directly on a
            # GPU host if you want a pre-baked image.
            PRECACHE_MODELS=0
          tags: |
            ghcr.io/${{ github.repository_owner }}/paddleocr-docker:${{ steps.tags.outputs.tag_latest }}
            ghcr.io/${{ github.repository_owner }}/paddleocr-docker:${{ steps.tags.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect pushed image
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/paddleocr-docker:${{ steps.tags.outputs.tag_sha }}"
          echo "Pulling $IMG to verify environment baked in..."
          docker pull "$IMG" >/dev/null

          envs=$(docker inspect "$IMG" --format '{{range .Config.Env}}{{println .}}{{end}}' \
                 | sed -E 's/^(OCR_API_KEY=).+/\1***SET***/; s/^(OCR_API_KEY=)$/\1***UNSET***/' \
                 | grep -E '^(OCR_|PADDLE_|HOME=|OMP_|PYTHONUNBUFFERED|PADDLE_PDX|DOCLING_|HF_)' || true)
          size_bytes=$(docker inspect "$IMG" --format '{{.Size}}')
          size_mib=$((size_bytes / 1048576))
          arch=$(docker inspect "$IMG" --format '{{.Architecture}}')
          os=$(docker inspect "$IMG" --format '{{.Os}}')
          digest=$(docker inspect "$IMG" --format '{{index .RepoDigests 0}}' || echo "")

          {
            echo ""
            echo "## Pushed image"
            echo ""
            echo "**Tags:**"
            echo "- \`ghcr.io/${{ github.repository_owner }}/paddleocr-docker:${{ steps.tags.outputs.tag_latest }}\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/paddleocr-docker:${{ steps.tags.outputs.tag_sha }}\`"
            echo ""
            echo "**Digest:** \`$digest\`"
            echo ""
            echo "**Size:** ${size_mib} MiB ($size_bytes bytes) · **Platform:** ${os}/${arch}"
            echo ""
            echo "### Baked environment (\`OCR_API_KEY\` value masked)"
            echo ""
            echo '```'
            echo "$envs"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
