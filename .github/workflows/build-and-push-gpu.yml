name: Build and push GPU image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.gpu'
      - 'app/**'
      - 'requirements.txt'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          platforms: linux/amd64
          build-args: |
            OCR_API_KEY=${{ secrets.OCR_API_KEY }}
            # CI runners have no NVIDIA driver, so importing paddlepaddle-gpu
            # to bake models fails. The first container boot on the GPU host
            # downloads models into the paddle-models volume and they stay
            # cached from then on. Build with PRECACHE_MODELS=1 directly on a
            # GPU host if you want a pre-baked image.
            PRECACHE_MODELS=0
          tags: |
            ghcr.io/${{ github.repository_owner }}/paddleocr-docker:gpu-latest
            ghcr.io/${{ github.repository_owner }}/paddleocr-docker:gpu-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
